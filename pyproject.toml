[project]
name = "flet-fonts"
version = "1.0.0"
description = "Utilizing Google Font dependencies to create a text widget in Flet that can change multiple font styles"
readme = "README.MD"
requires-python = ">=3.10"
authors = [
    { name = "arief minardi", email = "ariefminardi005@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "flet>=1.1.2,<2.0.0",
]

[project.urls]
Repository = "https://github.com/arief05652/flet-fonts"
Issues = "https://github.com/arief05652/flet-fonts/issues"

[tool.setuptools.package-data]
"flutter.flet_fonts" = ["**/*"]

[tool.setuptools]
license-files = ["LICENSE"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
